# KartRadar — yeni kampanya bildirimleri (GitHub Actions)
#
# Kullanıcı uygulamada saatini seçer: öğle 12:30 ya da akşam 19:30 (Türkiye saati).
# Bu iş son bildirimden beri hangi kartta kaç yeni kampanya geldiğini sayar ve o saatin konusuna
# (yeni_1230 / yeni_1930) TEK mesaj gönderir. Telefon kendi kartlarını süzüp tek bildirim gösterir.
# Firestore: çalışma başına en fazla 16 okuma, 1 yazma (kullanıcı sayısından bağımsız).
#
# ZAMANLAMA: asıl tetikleyici cron-job.org (tam 12:30 / 19:30'da /api/cron → bu iş, slot_id ile).
# Aşağıdaki schedule satırları YEDEK (~35 dk sonra). Bildirim zaten gittiyse yedek iş bir şey göndermez
# (aynı kampanya iki kez bildirilmez, telefon da aynı günün mesajını bir kez gösterir).
#
# Gerekli secret: FIREBASE_SERVICE_ACCOUNT_JSON (tarama ile aynı)

name: Yeni kampanya bildirimleri
run-name: ${{ inputs.slot_id && format('Zamanlanmış · {0}', inputs.slot_id) || (github.event_name == 'schedule' && format('Yedek · {0}', github.event.schedule) || 'Elle bildirim') }}

on:
  schedule: # YEDEK (UTC). Asıl saatler cron-job.org'da.
    - cron: "7 10 * * *" # 13:07 TR → 12:30 bildiriminin yedeği
    - cron: "7 17 * * *" # 20:07 TR → 19:30 bildiriminin yedeği
  workflow_dispatch:
    inputs:
      slot:
        description: "Hangi saatin kullanıcılarına"
        type: choice
        options: ["1230", "1930"]
        default: "1930"
      dry:
        description: "Deneme: ne gideceğini göster, gönderme"
        type: boolean
        default: true
      slot_id:
        description: "(cron-job.org doldurur) notify-1230 / notify-1930. Elle çalıştırırken boş bırak."
        required: false
        default: ""

# Aynı anda tek bildirim çalışması. Taramayla ayrı grupta: aynı grupta olursa sırada bekleyen bildirim,
# yeni gelen taramanın yerine geçmesiyle iptal edilebiliyordu.
concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Paketler
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Gönder
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TZ: Europe/Istanbul
        run: |
          SLOT_ID="${{ inputs.slot_id }}"
          case "${{ github.event.schedule }}" in
            "7 10 * * *") SLOT_ID="notify-1230" ;;
            "7 17 * * *") SLOT_ID="notify-1930" ;;
          esac
          FLAGS=""
          if [ -n "$SLOT_ID" ]; then
            SLOT="${SLOT_ID#notify-}"
            export KR_SCHEDULE="$SLOT_ID" KR_TRIGGER="zamanlanmış"
          else
            SLOT="${{ inputs.slot }}"
            export KR_TRIGGER="elle"
            if [ "${{ inputs.dry }}" = "true" ]; then FLAGS="--dry"; fi
          fi
          npx tsx src/notify.ts --slot "$SLOT" $FLAGS
